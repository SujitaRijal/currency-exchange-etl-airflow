name: CI PIPELINE

on:
  push:
    branches:
      - main
      - feature/*

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set Airflow UID
        run: echo "AIRFLOW_UID=50000" >> .env


      - name: Build Docker image
        run: docker compose build


      - name: Initialize Airflow
        run: docker compose up airflow-init


      - name: Start Airflow Services
        run: docker compose up -d --wait


      - name: Wait for services
        run: sleep 30


      - name: Run isort check
        run: |
          docker compose exec -T airflow-apiserver isort . --check-only


      - name: Run black check
        run: |
          docker compose exec -T airflow-apiserver black . --check


      - name: Run flake8
        run: |
          docker compose exec -T airflow-apiserver flake8 .


      - name: Run pytest with coverage
        run: |
          docker compose exec -T airflow-apiserver \
          python -m pytest -v \
          --cov=include \
          --cov=dags \
          --cov-report=term-missing


      - name: Shutdown containers
        if: always()
        run: docker compose down